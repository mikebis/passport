name: Validate and deploy passport to Azure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-apps-${{ github.ref }}
  # Supersede stale validation runs, but never interrupt a main deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Used only with mocked provider requests in validation builds.
      VITE_GOOGLE_CLIENT_ID: passport-validation.apps.googleusercontent.com
      VITE_GOOGLE_ANALYTICS_ID: G-0000000000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Exercise root production build
        run: npm run test:e2e
        env:
          TEST_PRODUCTION: '1'
          TEST_ANALYTICS_MODE: configured
      - name: Upload root browser-test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-root
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Build project-subpath variant
        run: npm run build
        env:
          BASE_PATH: /passport-test/
      - name: Exercise project-subpath production build
        run: npm run test:e2e
        env:
          TEST_PRODUCTION: '1'
          TEST_BASE_PATH: /passport-test/
          TEST_ANALYTICS_MODE: configured
      - name: Upload subpath browser-test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-subpath
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Build without analytics configuration
        run: npm run build
        env:
          BASE_PATH: /
          VITE_GOOGLE_ANALYTICS_ID: ''
      - name: Exercise unconfigured public-origin analytics
        run: npx playwright test analytics.spec.ts --grep "disabled analytics builds"
        env:
          TEST_PRODUCTION: '1'
          TEST_ANALYTICS_MODE: unconfigured
      - name: Exercise development analytics exclusion
        run: npx playwright test analytics.spec.ts --grep "disabled analytics builds"
        env:
          TEST_ANALYTICS_MODE: development
      - name: Upload analytics exclusion report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-analytics-exclusion
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Check Azure deployment token
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MEADOW_0F3FFA603 }}
        run: |
          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]; then
            echo "::error::Set the AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MEADOW_0F3FFA603 repository Actions secret to your existing Azure Static Web App's deployment token."
            exit 1
          fi
      - name: Build deployment artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run build
        env:
          BASE_PATH: /
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
      - name: Deploy to Azure Static Web Apps
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MEADOW_0F3FFA603 }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
