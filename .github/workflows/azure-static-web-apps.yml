name: Validate and deploy passport to Azure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Exercise root production build
        run: npm run test:e2e
        env:
          TEST_PRODUCTION: '1'
      - name: Build project-subpath variant
        run: npm run build
        env:
          BASE_PATH: /passport-test/
      - name: Exercise project-subpath production build
        run: npm run test:e2e
        env:
          TEST_PRODUCTION: '1'
          TEST_BASE_PATH: /passport-test/
      - name: Check Azure deployment token
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MEADOW_0F3FFA603 }}
        run: |
          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]; then
            echo "::error::Set the AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MEADOW_0F3FFA603 repository Actions secret to your existing Azure Static Web App's deployment token."
            exit 1
          fi
      - name: Build deployment artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run build
        env:
          BASE_PATH: /
      - name: Deploy to Azure Static Web Apps
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MEADOW_0F3FFA603 }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
