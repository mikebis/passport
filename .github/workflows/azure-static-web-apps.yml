name: Validate and deploy passport to Azure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-apps-${{ github.ref }}
  # Supersede stale validation runs, but never interrupt a main deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Used only with mocked provider requests in validation builds.
      VITE_GOOGLE_CLIENT_ID: passport-validation.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Exercise root production build
        run: npm run test:e2e
        env:
          TEST_PRODUCTION: '1'
      - name: Upload root browser-test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-root
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Build project-subpath variant
        run: npm run build
        env:
          BASE_PATH: /passport-test/
      - name: Exercise project-subpath production build
        run: npm run test:e2e
        env:
          TEST_PRODUCTION: '1'
          TEST_BASE_PATH: /passport-test/
      - name: Upload subpath browser-test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-subpath
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Check Azure deployment token
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MEADOW_0F3FFA603 }}
        run: |
          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]; then
            echo "::error::Set the AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MEADOW_0F3FFA603 repository Actions secret to your existing Azure Static Web App's deployment token."
            exit 1
          fi
      - name: Build deployment artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run build
        env:
          BASE_PATH: /
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Deploy to Azure Static Web Apps
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MEADOW_0F3FFA603 }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
